# @file   .github/workflows/browsers.yml
# @module ci
# @brief  The whole browser suite, every night and on demand (kit K106).
#
# Responsibility: the Playwright suite in three browsers (Chromium on three runners), which a
#                 pull request runs only in part (ci.yml). A red night is fixed before the next
#                 merge.
# Depends on:     .github/actions/setup, e2e/
# Spec:           docs/spec/08-devops-architecture.md §3, docs/spec/12-testing-strategy.md §4
name: Browsers

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Firefox and WebKit mobile one job each; Chromium, the slowest (~11.5 min alone), on three
    # runners (e2e-chromium-shard). Each job runs its timing specs after its other specs,
    # alone on its runner, so no other browser's load delays their timers. The Playwright
    # image brings the browsers and their system libraries: no apt step (an apt mirror once
    # took 38 of a 47-minute run).
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit-mobile]
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container: &e2e-container
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # The runner's user: Firefox refuses to run as root, and the workspace belongs to it.
      options: --user 1001
    services: &e2e-services
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: sbr
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sbr
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sbr -d sbr" --health-interval 2s --health-timeout 3s
          --health-retries 30
      # The e2e server's mail (password reset, D60), read back through Mailpit's API.
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    env:
      SBR_E2E_BROWSER: ${{ matrix.browser }}
      # The PostgreSQL service by its name (e2e/devStack.ts; no docker compose in the container).
      SBR_E2E_DATABASE_URL: postgres://sbr:ci-only@postgres:5432/sbr
      SBR_E2E_SMTP_HOST: mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The server on 3900 and the client on 5390 (e2e/playwright.config.ts).
      - run: pnpm e2e
      # On a failure: the traces and page snapshots of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  e2e-chromium-shard:
    # Chromium on three runners side by side: the regular specs in two shards, the timing
    # specs alone (--no-deps: their dependency, the regular project, runs in the shards).
    # Every test runs exactly once (a plain --shard would repeat the regular project in each
    # shard as the timing project's dependency).
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: 1/2, args: --project=chromium --shard=1/2 }
          - { name: 2/2, args: --project=chromium --shard=2/2 }
          - { name: timing, args: --project=chromium-timing --no-deps }
    name: e2e (chromium ${{ matrix.part.name }})
    runs-on: ubuntu-latest
    container: *e2e-container
    services: *e2e-services
    env:
      SBR_E2E_BROWSER: chromium
      SBR_E2E_DATABASE_URL: postgres://sbr:ci-only@postgres:5432/sbr
      SBR_E2E_SMTP_HOST: mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm e2e ${{ matrix.part.args }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-chromium-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  e2e-chromium:
    # The check under its old name "e2e (chromium)", for anything that requires it by name:
    # green only when every Chromium part is.
    name: e2e (chromium)
    needs: e2e-chromium-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-chromium-shard.result }}" = success
