# @file   .github/workflows/release.yml
# @module ci
# @brief  Release skeleton: on a version tag, publish the image to GHCR with an SBOM.
#
# Responsibility: refuse a tag whose commit is not on master or has no green CI run there;
#                 then build the multi-arch image from the tagged commit, push it to GHCR, and
#                 create the GitHub release with a CycloneDX SBOM. Signing comes before v1.0.0.
# Depends on:     Dockerfile
# Spec:           docs/spec/08-devops-architecture.md §2–§3, docs/spec/03-security-architecture.md §18
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
      actions: read # look up the CI run of the tagged commit
      # id-token: write is added together with cosign signing (keyless, GitHub OIDC).
    env:
      IMAGE: ghcr.io/weudlll-cyber/seasonal-bingo-royale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Nothing is published from a commit that is not on master with a green CI run.
      - name: Tag on master with green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master"
            exit 1
          fi
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" -eq 0 ]; then
            echo "::error::no green CI run on master for $GITHUB_SHA"
            exit 1
          fi
      # QEMU lets the amd64 runner build the arm64 variant.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag v1.2.3 becomes image tag 1.2.3, plus OCI labels (source, revision, licence).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: CycloneDX SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # Cosign signing: enable before v1.0.0 (remove both "if: false", grant id-token: write).
      - if: false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (cosign keyless)
        if: false
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: GitHub release with SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json --generate-notes --verify-tag
