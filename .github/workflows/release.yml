# @file   .github/workflows/release.yml
# @module ci
# @brief  A release, on a version tag: the signed image (the kit's workflow) and the GitHub release.
#
# Responsibility: refuse a tag whose commit is not on master or has no green CI run there; then
#                 the kit's release workflow builds the multi-arch image from the tagged commit,
#                 pushes it to GHCR, writes its CycloneDX SBOM and signs both without a key
#                 (K109; the installer verifies that signature, ops/lib/release.sh); then the
#                 GitHub release with the SBOM.
# Depends on:     Dockerfile, the kit's release-image.yml
# Spec:           docs/spec/08-devops-architecture.md §2–§3, docs/spec/03-security-architecture.md §18
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Nothing is published from a commit that is not on master with a green CI run.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # look up the CI run of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag on master with green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master"
            exit 1
          fi
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$green" -eq 0 ]; then
            echo "::error::no green CI run on master for $GITHUB_SHA"
            exit 1
          fi

  image:
    needs: check
    uses: weudlll-cyber/seasonal-kit/.github/workflows/release-image.yml@v0.41.0
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # the keyless signature's proof of this run
    with:
      # The admin Overview shows the installed version (the Dockerfile's argument).
      build-args: SBR_VERSION=${{ github.ref_name }} (${{ github.sha }})

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      actions: read # fetch this run's SBOM
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The image's SBOM
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sbom
      - name: GitHub release with SBOM
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
