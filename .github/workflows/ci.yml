# @file   .github/workflows/ci.yml
# @module ci
# @brief  CI: verify, security scans, docs links, the changed browser specs and the image.
#
# Responsibility: run what "pnpm verify" runs, the domain/application coverage, the
#                 server's integration coverage report, the dependency/secret scans, the
#                 license check of the production dependencies, the markdown link check
#                 and, in Chromium, the browser specs of what changed (e2e/changedSpecs;
#                 the whole suite in three browsers runs nightly, browsers.yml, K106) for
#                 every pull request to master and every push to master (a work branch is
#                 checked through its pull request, so one push starts one run); on the way
#                 to master also the image build and size check and the kit's security scan,
#                 which reports and does not block (K108). Any other red job blocks merge.
# Depends on:     .github/actions/setup, Dockerfile, osv-scanner.toml, e2e/, the kit's scan.yml
# Spec:           docs/spec/08-devops-architecture.md §3–§4, docs/spec/03-security-architecture.md §18
name: CI

on:
  # Pushes only on master: a push to a work branch with an open pull request would
  # otherwise start a second, identical run (QUIET-CI, 2026-11-01).
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # One group per pull request (a newer push cancels its older run). On master one group
  # per commit: in a shared group a later merge would still cancel the
  # earlier merge's run while it waits (GitHub keeps one pending run per group), even
  # without cancel-in-progress.
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.sha || github.head_ref || github.ref_name }}
  # Every merge commit on master must get its own finished run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Scanner images pinned by digest, like the actions by commit SHA.
env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  LYCHEE_IMAGE: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The same script developers run locally: format check, lint, typecheck, tests.
      - run: pnpm verify
      # Domain and application coverage against the thresholds in vitest.config.ts (12 §2).
      - run: pnpm test:coverage

  coverage-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The server code the integration tests reach, per file and in total (12 §2); a report
      # in the job log, no threshold yet. Beside verify, so it adds no waiting time.
      - run: pnpm test:integration:coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full history, not just the last commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: osv-scanner (lockfile)
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source \
            --config=osv-scanner.toml --lockfile=pnpm-lock.yaml --format json --output-file osv.json
          code=$?
          set -e
          # Exit 1 means "findings"; anything else besides 0 is a scanner error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
          jq -r '.results[]?.packages[]? | .package as $p | .groups[]?
            | "\($p.name)@\($p.version) \(.ids | join(",")) severity=\(.max_severity // "unknown")"' osv.json
          # High = CVSS >= 7. An unrated finding counts as high so nothing slips through.
          high=$(jq '[.results[]?.packages[]?.groups[]?
            | select((.max_severity // "") == "" or (.max_severity | tonumber) >= 7)] | length' osv.json)
          if [ "$high" -gt 0 ]; then
            echo "::error::$high high or critical osv-scanner finding(s)"
            exit 1
          fi
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1
      # Licenses compatible with AGPL-3.0-or-later only (spec 03 §18); a new one fails until reviewed.
      # MIT-0 (nodemailer, 2026-11-06) is MIT without the attribution clause.
      - name: License check (production dependencies)
        run: |
          allowed='["MIT","MIT-0","ISC","0BSD","BSD-2-Clause","BSD-3-Clause","Apache-2.0","BlueOak-1.0.0","CC0-1.0","Unlicense","MPL-2.0","LGPL-3.0-or-later","GPL-3.0-or-later","AGPL-3.0-or-later"]'
          denied=$(pnpm -r licenses list --prod --json | jq -r --argjson ok "$allowed" \
            'to_entries[] | select(.key as $k | $ok | index($k) | not) | "\(.key): \([.value[].name] | join(", "))"')
          if [ -n "$denied" ]; then
            echo "::error::licenses not on the allow list:"
            echo "$denied"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between the repository's own files (no network: external sites come and go).
      - name: Markdown link check
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$LYCHEE_IMAGE" --offline --no-progress \
            --exclude-path node_modules --exclude-path reports '**/*.md'

  e2e-chromium:
    # The browser specs of what this change touched, in Chromium; the whole suite in every
    # browser runs nightly (browsers.yml). The job keeps the name a branch rule may require.
    name: e2e (chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # The runner's user: Firefox refuses to run as root, and the workspace belongs to it.
      options: --user 1001
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: sbr
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sbr
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sbr -d sbr" --health-interval 2s --health-timeout 3s
          --health-retries 30
      # The e2e server's mail (password reset, D60), read back through Mailpit's API.
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    env:
      SBR_E2E_BROWSER: chromium
      # The PostgreSQL service by its name (e2e/devStack.ts; no docker compose in the container).
      SBR_E2E_DATABASE_URL: postgres://sbr:ci-only@postgres:5432/sbr
      SBR_E2E_SMTP_HOST: mailpit
      # What the change is measured against: the pull request's base, or the pushed range's start.
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: The specs of what changed
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          specs=$(git diff --name-only "$BASE...HEAD" |
            pnpm --silent --filter @sbr/server exec tsx ../../e2e/changedSpecs.ts)
          echo "browser specs: $specs"
          echo "SPECS=$specs" >>"$GITHUB_ENV"
      # The timing specs after the others, alone, as in the full suite.
      - name: Browser specs
        if: env.SPECS != 'none'
        shell: bash
        run: |
          files=()
          [ "$SPECS" = all ] || read -r -a files <<<"$SPECS"
          pnpm e2e "${files[@]}" --project=chromium --pass-with-no-tests
          pnpm e2e "${files[@]}" --project=chromium-timing --no-deps --pass-with-no-tests
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-chromium
          path: test-results
          retention-days: 7

  image:
    # Only on the way to master: PRs to master and pushes to master.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      IMAGE: sbr:ci
      # Size budget from docs/spec/08-devops-architecture.md §3 (uncompressed, as Docker reports it).
      MAX_IMAGE_BYTES: 250000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t "$IMAGE" .
      - name: Size budget
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB (budget $((MAX_IMAGE_BYTES / 1000000)) MB)"
          if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "::error::Image exceeds the size budget"
            exit 1
          fi

  scan:
    # The kit's scan (K108): Trivy over the image and the lockfile, a ZAP baseline against the
    # started app; it reports into the job summary and does not block.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    uses: weudlll-cyber/seasonal-kit/.github/workflows/scan.yml@v0.39.1
    permissions:
      contents: read
    with:
      image: sbr:ci
      url: http://localhost:3000/
      # The app with its database on the runner's network; every key is made for this run.
      start: |
        db=$(openssl rand -hex 16)
        docker run -d --name sbr-scan-db --network host -e POSTGRES_USER=sbr -e POSTGRES_DB=sbr \
          -e POSTGRES_PASSWORD="$db" postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        for i in $(seq 1 60); do docker exec sbr-scan-db pg_isready -h 127.0.0.1 -U sbr -d sbr && break; sleep 1; done
        settings=(-e DATABASE_URL="postgres://sbr:$db@127.0.0.1:5432/sbr" -e SBR_PORT=3000
          -e SBR_SEED_KEY="$(openssl rand -hex 32)" -e SBR_RECOVERY_KEY="$(openssl rand -hex 32)")
        docker run --rm --network host "${settings[@]}" "$IMAGE" node dist/cli.js migrate
        docker run -d --name sk-scan-app --network host "${settings[@]}" "$IMAGE"
