<!doctype html>
<!--
  @file   apps/web/index.html
  @module web
  @brief  The player client's page: the root element, the early theme script, the entry module.

  Responsibility: load theme-init.js before the first paint (an external file: the CSP
                  forbids inline scripts; the kit's early script, served and emitted by its
                  Vite plugin themeInit, vite.config.ts), then the React entry ./src/main.tsx
                  into #root.
  Depends on:     @seasonal/kit (browser/theme-init.js through @seasonal/kit/vite), src/main.tsx
  Spec:           docs/spec/01-game-design.md §13; docs/spec/03-security-architecture.md §7
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seasonal Bingo Royale</title>
    <!-- Sets data-theme before the first paint; an external file, as the CSP forbids inline scripts -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
