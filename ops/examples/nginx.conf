# @file   ops/examples/nginx.conf
# @brief  Example: Seasonal Bingo Royale behind an existing nginx (no Caddy of its own).
#
# Responsibility: forward the whole site (pages, /api) and the WebSocket /ws to the app,
#                 with the upgrade headers the WebSocket needs and the visitor's address in
#                 X-Forwarded-For. The app must trust this proxy: SBR_TRUSTED_PROXIES=<nginx
#                 address>, and SBR_PUBLIC_URL=https://bingo.example.org/ in /etc/sbr/<env>.env.
#                 The app container publishes no port by default; publish 127.0.0.1:3000
#                 (a compose override) or put nginx on the app's Docker network.
# Spec:           docs/spec/09-deployment-architecture.md §8
#
# Under a path instead (e.g. /games/bingo/): set SBR_BASE_PATH=/games/bingo/, use
# "location /games/bingo/ { … }" with the same lines and keep the path (no trailing
# slash after proxy_pass's address), redirect /games/bingo to /games/bingo/, and answer
# "location /games/bingo/metrics { return 404; }".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bingo.example.org;
    ssl_certificate     /etc/letsencrypt/live/bingo.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bingo.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived game sockets (the server pings every 20 s).
        proxy_read_timeout 120s;
    }

    # Metrics stay inside.
    location /metrics { return 404; }
}

server {
    listen 80;
    server_name bingo.example.org;
    return 301 https://$host$request_uri;
}
